# Retrieval gold set: agent-style queries -> documents that answer them.
# Written from the corpus titles and section headings before running any retrieval
# variant. `relevant`: any of these documents counts as a hit. `txn_date`: the
# transaction date the agent is dealing with, for queries whose answer depends on the
# policy version (2017-regime vs 2027-regime liability; the 2018 edition is superseded).
- {q: "customer liability for an unauthorised card payment reported the next day", relevant: [KB-POL-LIAB-A], txn_date: 2026-11-24, versioned: true}
- {q: "customer reported a fraudulent UPI debit after six working days, how much is she liable for", relevant: [KB-POL-LIAB-A], txn_date: 2026-11-10, versioned: true}
- {q: "third party breach reported within three days zero liability", relevant: [KB-POL-LIAB-A], txn_date: 2026-10-02, versioned: true}
- {q: "maximum liability for a credit card with limit above 5 lakh reported in 4 to 7 days", relevant: [KB-POL-LIAB-A], txn_date: 2026-09-15, versioned: true}
- {q: "fraudulent transaction in February 2027, who bears the burden of proof", relevant: [KB-POL-LIAB-B], txn_date: 2027-02-10, versioned: true}
