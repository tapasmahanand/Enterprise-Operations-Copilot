# docker compose up --build   → postgres, one-shot ingest, app on http://localhost:8000
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
      POSTGRES_DB: kestrel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  ingest:
    build: .
    command: ["python", "-m", "kestrel.ingest.run"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kestrel:kestrel@postgres:5432/kestrel
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://kestrel:kestrel@postgres:5432/kestrel
    depends_on:
      ingest:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
