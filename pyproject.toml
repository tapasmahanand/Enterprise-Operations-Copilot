[project]
name = "kestrel-ops-copilot"
version = "0.1.0"
description = "Tier-1 resolution copilot for a fictional Indian retail bank (Agentic AI capstone)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pyyaml>=6.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
  "httpx>=0.27",
  "openai>=1.40",
  "langgraph>=1.0",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg-pool>=3.2",
  "langfuse>=3.0",
  "nats-py>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kestrel*"]

[tool.setuptools.package-data]
kestrel = ["ui/*.html"]
